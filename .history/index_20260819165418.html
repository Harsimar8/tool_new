<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Terrain Tools</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         TERRAIN TOOLS PANEL
    ====================================================== -->

    <aside class="terrain-panel" id="terrainTools">

        <!-- JavaScript will build everything inside here -->
        <div id="terrainPanelContent"></div>

    </aside>


    <!-- =====================================================
         SYMBOL PICKER
    ====================================================== -->

    <div id="symbolPicker" class="symbol-picker">

        <div class="symbol-picker-header">

            <span id="symbolPickerTitle">
                SYMBOL
            </span>

            <button
                class="symbol-picker-close"
                onclick="closeSymbolPicker()">
                ×
            </button>

        </div>

        <div
            id="symbolPickerGrid"
            class="symbol-picker-grid">
        </div>

    </div>


    <!-- =====================================================
         CENTER TOOL NOTIFICATION
    ====================================================== -->

    <div
        id="toolNotification"
        class="tool-notification">

        <span class="notification-icon">✓</span>

        <div>

            <div id="notificationText">
                Terrain editor ready
            </div>

            <small>
                TOOL SELECTED
            </small>

        </div>

    </div>


    <!-- =====================================================
         APPLICATION SCRIPT
    ====================================================== -->

    <script type="module" src="script.js"></script>

</body>

</html>
