
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Terrain Tools</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Terrain toolbar -->
    <aside
        id="terrainTools"
        class="terrain-panel">

        <!-- render.js builds the toolbar here -->
        <div id="terrainPanelContent"></div>

    </aside>


    <!-- Symbol subtype popup -->
    <div
        id="symbolPicker"
        class="symbol-picker">

        <div class="symbol-picker-header">

            <span id="symbolPickerTitle">
                SYMBOL
            </span>

            <button
                id="symbolPickerClose"
                class="symbol-picker-close"
                type="button">
                ×
            </button>

        </div>

        <div
            id="symbolPickerGrid"
            class="symbol-picker-grid">
        </div>

    </div>


    <!-- Center selection notification -->
    <div
        id="toolNotification"
        class="tool-notification">

        <span
            id="notificationIcon"
            class="notification-icon">
            ✓
        </span>

        <div>

            <div id="notificationText">
                Terrain editor ready
            </div>

            <small id="notificationSubtitle">
                TOOL SELECTED
            </small>

        </div>

    </div>


    <!-- Main application -->
    <script
        type="module"
        src="script.js">
    </script>

</body>

</html>
