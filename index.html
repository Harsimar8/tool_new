<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrain Tools</title>
    <link rel="stylesheet" href="style6.css">
</head>

<body>

    <aside class="terrain-panel">

        <!-- HEADER (Dynamic) -->
        <div id="panelHeaderContainer"></div>

        <!-- CONTROL SECTIONS (Dynamic) -->
        <div id="dynamicPanelContent"></div>

        <!-- STATUS -->
        <div class="panel-status">
            <span class="status-dot"></span>
            <span id="statusText">Terrain editor ready</span>
        </div>

    </aside>

    <!-- SYMBOL PICKER -->
    <div id="symbolPicker" class="symbol-picker">
        <div class="symbol-picker-header">
            <span id="symbolPickerTitle">RADAR</span>
            <button class="symbol-picker-close" onclick="closeSymbolPicker()">×</button>
        </div>
        <div id="symbolPickerGrid" class="symbol-picker-grid"></div>
    </div>

    <!-- CENTER NOTIFICATION -->
    <div id="toolNotification" class="tool-notification">
        <span class="notification-icon">✓</span>
        <div>
            <div id="notificationText">Elevation Colours</div>
            <small>TOOL SELECTED</small>
        </div>
    </div>

    <!-- Load render script first, then main logic -->
    <script type="module" src="render.js"></script>
    <script type="module" src="script.js"></script>

</body>

</html>
