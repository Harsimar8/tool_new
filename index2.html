
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrain Tools - Tactical Suite</title>
    <link rel="stylesheet" href="style11.css">
</head>
<body>

    <!-- DUAL-COLUMN TACTICAL DOCK -->
    <aside class="tactical-menu-dock">

        <!-- COLUMN 1: LEFT CATEGORY RAIL (Dynamic) -->
        <div id="categoryRail" class="category-rail"></div>

        <!-- COLUMN 2: ACTIVE TOOL DRAWER (Dynamic) -->
        <div class="tool-drawer">
            <!-- PANEL HEADER -->
            <div id="panelHeaderContainer"></div>

            <!-- DYNAMIC SECTIONS -->
            <div id="dynamicPanelContent"></div>

            <!-- STATUS BAR -->
            <div class="panel-status">
                <span class="status-dot"></span>
                <span id="statusText">Terrain editor ready</span>
            </div>
        </div>

    </aside>

    <!-- CENTER NOTIFICATION TOAST -->
    <div id="toolNotification" class="tool-notification">
        <span class="notification-icon">✓</span>
        <div>
            <div id="notificationText">Elevation Colours</div>
            <small>TOOL SELECTED</small>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="render10.js"></script>
    <script type="module" src="script10.js"></script>
</body>
</html>
